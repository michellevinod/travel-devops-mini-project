services:
  app:
    build: .
    container_name: travel-app
    ports: ["5000:5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
  selenium:
    image: selenium/standalone-chrome:latest
    container_name: travel-selenium
    shm_size: 2gb
    ports: ["4444:4444"]
    depends_on:
      app:
        condition: service_started
  prometheus:
    image: prom/prometheus:latest
    container_name: travel-prometheus
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [app]
  grafana:
    image: grafana/grafana:latest
    container_name: travel-grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./monitoring/dashboard.json:/var/lib/grafana/dashboards/travel.json:ro
      - ./monitoring/grafana-dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
    depends_on: [prometheus]
