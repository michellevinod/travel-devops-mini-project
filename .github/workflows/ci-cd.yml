
name: Travel Booking CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker image
        run: docker build -t travel-booking:${{ github.sha }} .

      - name: Start application and Selenium
        run: docker compose up -d --build app selenium

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:5000/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs app
          exit 1

      - name: Run API tests
        env:
          APP_URL: http://localhost:5000
        run: python -m pytest tests/test_api.py -v

      - name: Run Selenium UI tests
        env:
          SELENIUM_URL: http://localhost:4444/wd/hub
          UI_APP_URL: http://app:5000
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:4444/wd/hub/status; then
              break
            fi
            sleep 2
          done
          python -m pytest tests/test_ui.py -v

      - name: Deploy validated application
        run: docker compose up -d --build app prometheus grafana

      - name: Show deployment status
        if: success()
        run: docker compose ps

      - name: Show logs if pipeline fails
        if: failure()
        run: docker compose logs --tail=100 app selenium
